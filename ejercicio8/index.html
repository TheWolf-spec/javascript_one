<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Separador de texto</title>
</head>
<body>
    <h1>Separador de texto</h1>
    <p>Consigna: Diseña una función que, dada una cadena de texto, devuelva un array de textos separados por un carácter específico.
        Por ejemplo, miFuncion('hola que tal', ' ') debería devolver ['hola', 'que', 'tal'].</p>

        <label for="">Ingresa el texto</label>
        <input type="text" id="text">
        <hr>

        <label for="">Ingresa caracter que separara el texto </label>
        <input type="text" id="char">

        <hr>
        <button id="separar">Separar</button>
        <hr>

        <p>El resultado obtiene: <span id="resultado"></span></p>


    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar el número máximo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightsteelblue;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Encontrar el número máximo</h1>
    <p>Consigna: Crea una función que reciba un arreglo de números y devuelva el número máximo, sin utilizar Math.max().</p>

    <label for="">Ingresa un numero para el array</label>
    <input id="number" type="number" placeholder="23" step="1" >
    <button id="add">Agregar numero</button>

    <p>Contenido actual del array: <span id="array"></span></p>

    <button id="calc">Calcular Maximo</button>

    <p>EL numero maximo es: <span id="result"></span></p>


    <script src="script.js" ></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversión de unidades:</title>
</head>
<body>
    <h1>Conversión de unidades:</h1>
    <p>Consigna: Convierte a segundos una medida de tiempo dada en horas y minutos.</p>
    <label for="cantidadhoras">Introduce las  horas </label>
    <input type="number" id="horas" step="1" placeholder="2...">

    <label for="cantidadhoras">Introduce las  minutos </label>
    <input type="number" id="minutos" step="1" placeholder="30...">

    <button id="calcular">calcular</button>

    <p>En segundos: <span id="resultado"></span></p>

    <script src="script.js"></script>
</body>
</html>

<body>
    <h1>Subcadena más larga sin caracteres repetidos:</h1>
    <p>Dada una cadena de texto, encuentra la longitud de la subcadena más larga que no contenga caracteres repetidos. Por ejemplo, para "abbbcabcdefef" la respuesta sería 6 ("abcdef").</p>
    <hr>
    <label for="">ingresa el texto: </label>
    <input type="text" placeholder="dvdf...." id="text">
    <button id="calc">Calcular</button>
    <p>La longitud de cadena mas larga es : <span id="result"></span></p>    
    <script src="script.js"></script>
</body>

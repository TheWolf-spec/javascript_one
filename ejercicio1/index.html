<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precio con IVA (Simple)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        label, input, button { display: block; margin-bottom: 10px; }
        #resultado { font-weight: bold; color: blue; }
    </style>
</head>
<body>
    <h1>Calculadora de Precio con IVA</h1>

    <label for="precioProducto">Precio del Producto ($):</label>
    <input type="number" id="precioProducto" step="0.01" placeholder="Ej: 100.00">

    <label for="tasaIVA">Tasa de IVA (%):</label>
    <input type="number" id="tasaIVA" step="0.01" value="13" placeholder="Ej: 13">

    <button id="calcularBtn">Calcular Precio Total</button>

    <p>Precio Total con IVA: <span id="resultado"></span></p>

    <script src="script.js"></script>
</body>
</html>
